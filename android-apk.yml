name: JARVIS Android APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Informational only: lints/deprecations must not block the APK.
      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Build debug APK (fallback)
        run: flutter build apk --debug

      - name: Prepare downloadable package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/JARVIS-Android-APK.apk
          cp build/app/outputs/flutter-apk/app-debug.apk dist/JARVIS-Android-APK-debug.apk
          cd dist
          zip JARVIS-Android-APK.zip JARVIS-Android-APK.apk JARVIS-Android-APK-debug.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: |
            dist/JARVIS-Android-APK.apk
            dist/JARVIS-Android-APK-debug.apk
            dist/JARVIS-Android-APK.zip
          if-no-files-found: error
          retention-days: 14
